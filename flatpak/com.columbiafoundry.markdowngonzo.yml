id: com.columbiafoundry.markdowngonzo
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk

command: markdowngonzo

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network # LibreOffice PDF export and opening http(s) links; no update checks or telemetry
  - --talk-name=org.freedesktop.FileManager1 # "Show in file manager"
  - --filesystem=home # drag-and-drop from a host file manager has no portal
  # equivalent to the FileChooser portal that covers Open/Save dialogs -
  # the sandbox can't see a dropped file's path without this. Confirmed
  # by testing: drag-and-drop silently failed without it. Deliberately
  # =home, not =host - narrower, and covers the common case (images
  # living somewhere under $HOME). Open()/save() dialogs still use the
  # portal regardless; this is specifically for the drag-and-drop gap.

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable

build-options:
  append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin

modules:
  - name: markdowngonzo
    buildsystem: simple
    build-options:
      env:
        HOME: /run/build/markdowngonzo
        CARGO_HOME: /run/build/markdowngonzo/src-tauri/.cargo-home
        npm_config_cache: /run/build/markdowngonzo/flatpak-node/npm-cache
        npm_config_offline: "true"
    sources:
      - type: git
        url: https://github.com/gregoftheweb/MarkDownGonzo.git
        # TEMPORARY while debugging the Flatpak image-import bug: tracks
        # main instead of a pinned tag, so each fix lands on rebuild
        # without re-tagging every time. Pin back to a real tag (e.g.
        # v1.0.3) once the bug is fixed and a release is cut.
        branch: main
      - cargo-sources.json
      - node-sources.json
    build-commands:
      - cd markdowngonzo && mkdir -p src-tauri/.cargo
      - |
        cat > markdowngonzo/src-tauri/.cargo/config.toml <<'EOF'
        [source.crates-io]
        replace-with = "vendored-sources"

        [source.vendored-sources]
        directory = "/run/build/markdowngonzo/cargo/vendor"
        EOF
      - cd markdowngonzo && npm ci --offline
      - cd markdowngonzo && npm run tauri build -- --bundles deb
      - cd markdowngonzo && ar -x src-tauri/target/release/bundle/deb/markdowngonzo_*_amd64.deb
      - cd markdowngonzo && tar -xf data.tar.gz
      - sed -i 's#<launchable type="desktop-id">markdowngonzo.desktop</launchable>#<launchable type="desktop-id">com.columbiafoundry.markdowngonzo.desktop</launchable>#' markdowngonzo/usr/share/metainfo/com.columbiafoundry.markdowngonzo.metainfo.xml
      - install -Dm755 markdowngonzo/usr/bin/markdowngonzo /app/bin/markdowngonzo
      - install -Dm644 markdowngonzo/usr/share/applications/markdowngonzo.desktop /app/share/applications/com.columbiafoundry.markdowngonzo.desktop
      - install -Dm644 markdowngonzo/usr/share/icons/hicolor/32x32/apps/markdowngonzo.png /app/share/icons/hicolor/32x32/apps/com.columbiafoundry.markdowngonzo.png
      - install -Dm644 markdowngonzo/usr/share/icons/hicolor/128x128/apps/markdowngonzo.png /app/share/icons/hicolor/128x128/apps/com.columbiafoundry.markdowngonzo.png
      - install -Dm644 markdowngonzo/usr/share/icons/hicolor/256x256@2/apps/markdowngonzo.png /app/share/icons/hicolor/256x256/apps/com.columbiafoundry.markdowngonzo.png
      - install -Dm644 markdowngonzo/usr/share/metainfo/com.columbiafoundry.markdowngonzo.metainfo.xml /app/share/metainfo/com.columbiafoundry.markdowngonzo.metainfo.xml
      - install -Dm644 markdowngonzo/usr/share/mime/packages/markdowngonzo.xml /app/share/mime/packages/com.columbiafoundry.markdowngonzo.xml
      - desktop-file-edit --set-key=Exec --set-value="markdowngonzo %F" --set-icon=com.columbiafoundry.markdowngonzo /app/share/applications/com.columbiafoundry.markdowngonzo.desktop
