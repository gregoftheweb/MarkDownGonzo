name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: markdowngonzo

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: markdowngonzo/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: markdowngonzo/src-tauri

      - run: npm ci

      - name: Frontend — build and test
        run: |
          npm run build
          npm test

      - name: Rust — test and clippy
        working-directory: markdowngonzo/src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked -- -D warnings
