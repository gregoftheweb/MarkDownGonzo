[package]
name = "gonzowrite"
version = "0.1.0"
description = "A focused, local-first Markdown editor"
authors = ["gonzo"]
edition = "2021"

[lib]
name = "gonzowrite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
